# The Android app: the engine (crates/moli-android) and the APK, then its
# signature with the owner's certificate when the secret ANDROID_SIGNING_BUNDLE
# exists. Until then, an APK signed with the runner's debug key, for a trial.
# From main, the APK is published at a fixed address (pre-release `apk`):
# https://github.com/torshu-hub/moli-android/releases/download/apk/moli.apk
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android
      - name: NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null'
      - name: Dashboard
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Engine
        run: sh scripts/build-android.sh
      - name: APK
        working-directory: android
        run: ./gradlew --no-daemon -PmoliVersionCode=${{ github.run_number }} :app:assembleRelease :app:assembleDebug
      - name: Gather
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/moli-unsigned.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk out/moli-essai-debug.apk
          git rev-parse HEAD > out/source.txt
          # The engine is in the APK, with NativeServer's four entry points.
          unzip -l out/moli-unsigned.apk | grep -q 'lib/arm64-v8a/libmoli_android.so'
          nm="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test "$("$nm" -D --defined-only android/app/src/main/jniLibs/arm64-v8a/libmoli_android.so | grep -c ' Java_io_moli_android_NativeServer_')" = 4
      # The repository is public, so is the APK: nothing but public strings in it.
      # Secrets (keys, tokens) stop the build; e-mails and MAC-like strings are
      # third parties' (libraries, root certificates), listed for review.
      - name: Nothing secret in the APK
        run: |
          scan="$RUNNER_TEMP/scan"
          mkdir -p "$scan/scripts" "$RUNNER_TEMP/apk"
          cp scripts/leak-check.sh "$scan/scripts/"
          unzip -q out/moli-unsigned.apk -d "$RUNNER_TEMP/apk"
          find "$RUNNER_TEMP/apk" -type f -exec strings -n 6 {} + > "$scan/apk-strings.txt"
          printf '%s\n' '@' '[0-9A-Fa-f]{2}([:-][0-9A-Fa-f]{2}){5}' > "$RUNNER_TEMP/apk-allow.txt"
          MOLI_ALLOWLIST="$RUNNER_TEMP/apk-allow.txt" sh "$scan/scripts/leak-check.sh"
          {
            echo "Adresses e-mail dans l'APK (chaînes de tiers) :"
            grep -ohE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$scan/apk-strings.txt" | sort -u | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Debug certificate
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null
          echo "Certificat de l'APK d'essai debug : \`$("$tools/apksigner" verify --print-certs out/moli-essai-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p')\`" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-unsigned
          path: |
            out/moli-unsigned.apk
            out/source.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moli-essai-debug
          path: out/moli-essai-debug.apk
          if-no-files-found: error

  # No checkout: only the APK built above meets the key.
  sign:
    needs: apk
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: moli-unsigned
          path: in
      - name: Sign
        id: sign
        env:
          BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$BUNDLE" ]; then
            echo "Secret ANDROID_SIGNING_BUNDLE absent : pas d'APK signée par le certificat du propriétaire (l'APK d'essai debug est dans les artefacts)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Same JSON as the old fork's BETA_SIGNING_BUNDLE: {"p12": base64, "password": "..."}.
          python3 -I - <<'PY'
          import base64, json, os
          bundle = json.loads(os.environ['BUNDLE'])
          print('::add-mask::' + bundle['password'])
          target = os.path.join(os.environ['RUNNER_TEMP'], 'key.p12')
          fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as out:
              out.write(base64.b64decode(bundle['p12'], validate=True))
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'key.pass'), 'w', opener=lambda p, f: os.open(p, f, 0o600)) as out:
              out.write(bundle['password'])
          PY
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null
          mkdir -p out
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 \
            --ks-pass "file:$RUNNER_TEMP/key.pass" --key-pass "file:$RUNNER_TEMP/key.pass" \
            --out out/moli.apk in/moli-unsigned.apk
          rm -f "$RUNNER_TEMP/key.p12" "$RUNNER_TEMP/key.pass"
          cert=$("$tools/apksigner" verify --print-certs out/moli.apk | sed -n 's/.*certificate SHA-256 digest: //p')
          cp in/source.txt out/
          (cd out && sha256sum moli.apk > SHA256SUMS)
          echo "APK signée. Certificat SHA-256 : \`$cert\`. Source : \`$(cat in/source.txt)\`." >> "$GITHUB_STEP_SUMMARY"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.sign.outputs.signed == 'true'
        with:
          name: moli-signed
          path: out/
          if-no-files-found: error

  # From main only: the APK at a fixed address, replaced at each build, for the
  # tablet (no GitHub account, no zip). The owner's signed APK when it exists,
  # else the trial one (debug key: uninstall the previous one first).
  publish:
    needs: [apk, sign]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.sign.outputs.signed == 'true'
        with:
          name: moli-signed
          path: in
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.sign.outputs.signed != 'true'
        with:
          name: moli-essai-debug
          path: in
      - name: Pre-release apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SIGNED: ${{ needs.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            cp in/moli.apk moli.apk
            kind="signée par le certificat du propriétaire : s'installe par-dessus la précédente"
          else
            cp in/moli-essai-debug.apk moli.apk
            kind="d'essai, signée par la clé debug du runner : désinstaller la précédente avant (les données de l'appli sont perdues)"
          fi
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$tools/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;35.0.0" > /dev/null
          cert=$("$tools/apksigner" verify --print-certs moli.apk | sed -n 's/.*certificate SHA-256 digest: //p')
          sum=$(sha256sum moli.apk | cut -d' ' -f1)
          notes="APK $kind.

          Source : $GITHUB_SHA (build $GITHUB_RUN_NUMBER, $(date -u +%Y-%m-%d)).
          Certificat SHA-256 : \`$cert\`
          APK SHA-256 : \`$sum\`"
          gh release view apk > /dev/null 2>&1 ||
            gh release create apk --prerelease --target "$GITHUB_SHA" --title "Moli Android (dernière APK de main)" --notes "$notes"
          # The tag follows the APK's source.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/apk" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release upload apk moli.apk --clobber
          gh release edit apk --notes "$notes"
          echo "APK publiée : https://github.com/$GH_REPO/releases/download/apk/moli.apk" >> "$GITHUB_STEP_SUMMARY"
